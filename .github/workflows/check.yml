# CI for the collection: full `nix flake check` (x86_64: 4 VM tests + all
# pure-eval checks) plus an aarch64 eval-portability pass. The VM tests need
# KVM on the runner — public GitHub ubuntu runners expose /dev/kvm since
# 2024 but with root-only perms, hence the chmod step.
#
# STANDING MANUAL GATES — these CANNOT run here and must be run locally
# after the changes that trigger them:
#   - tests/parity/run.sh (or `nix run .#parity-diff`): semantic lib parity
#     vs the SystemNix fork. Needs the SystemNix sibling checkout
#     (SYSTEMNIX_PATH= overrides; default ~/projects/SystemNix) because it
#     imports BOTH lib trees over the same nixpkgs — CI has no such access.
#     RUN IT after every lib/ change here or SystemNix-side.
#   - tests/negative/run.sh (or `nix run .#negative-tests`): the mutation
#     harness. It drives `nix build --impure` against mutated COPIES of this
#     tree, which cannot run inside hermetic flake checks. RUN IT after
#     touching module assertions or contract pins.
name: check

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  flake-check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Enable KVM for the VM tests
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          else
            echo "::warning::no /dev/kvm on this runner — VM tests will fall back to qemu TCG (slow)"
          fi

      - name: aarch64 eval portability (pure checks, no build)
        run: nix flake check --all-systems --no-build

      - name: Full flake check (VM tests included)
        run: nix flake check -L

      # Retry ONCE for the known Ubuntu-26 runner VM races (by-label device
      # symlink vs mount device-timeout; udev settle under slow I/O): store
      # paths from the first attempt are cached, so the retry rebuilds only
      # the failed VM. Two consecutive failures = a real regression — the
      # retry never masks that (it fails red again).
      - name: Full flake check — retry once (Ubuntu-26 VM races)
        if: failure()
        run: nix flake check -L

      # Visibility reminder: two STANDING gates live outside this workflow
      # (details in the header comment). Green here does NOT mean the
      # parity diff or the mutation harness ran.
      - name: Reminder — manual gates not covered by CI
        run: |
          echo "::notice::Manual gates NOT run by this workflow:" \
            "tests/parity/run.sh (after lib/ changes; needs SystemNix sibling)" \
            "and tests/negative/run.sh (after assertion/contract changes)"
